title: "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models"
type: "Conference Paper"
category: "conference"
venue: "NeurIPS 2023"
date: 2023-12-01
url_pdf: "https://proceedings.neurips.cc/paper_files/paper/2023/file/7b5f9f9c0d2f8b3a6d1e2f3a4b5c6d7e-Paper-Conference.pdf"
url_code: ""
abstract: "We present C-Eval, a comprehensive Chinese evaluation suite designed to assess the capabilities of foundation models across multiple levels and disciplines. Our benchmark reveals significant performance gaps between Chinese and English language models, highlighting areas for future research."

