title: "On the Universal Truthfulness Hyperplane Inside LLMs"
type: "Conference Paper"
category: "conference"
venue: "EMNLP 2024"
date: 2024-11-01
url_pdf: "https://aclanthology.org/2024.emnlp-main.123.pdf"
url_code: "https://github.com/Vicent0205/Universal_Truthfulness_Hyperplane"
abstract: "We uncover a universal truthfulness hyperplane inside large language models, demonstrating that models exhibit a consistent directional bias toward truthful responses. This finding has significant implications for understanding model behavior and developing more reliable AI systems."

