title: "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation"
type: "Conference Paper"
category: "conference"
venue: "ICML 2024"
date: 2024-07-01
url_pdf: "https://proceedings.mlr.press/v235/chen24a.html"
url_code: ""
abstract: "We propose a novel framework for detecting and mitigating hallucinations in large language models by analyzing the sharpness of inner representations. Our approach identifies when models are approaching uncertainty boundaries, enabling proactive hallucination detection."

