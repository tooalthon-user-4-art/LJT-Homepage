title: "On the Perception Bottleneck of VLMs for Chart Understanding"
type: "Preprint"
category: "preprint"
venue: "arXiv preprint"
date: 2025-06-08
url_pdf: "https://arxiv.org/abs/2506.00002"
url_code: "https://github.com/Vicent0205/Vision4Chart"
abstract: "We investigate the fundamental limitations of vision-language models when processing charts and graphical data. Our analysis reveals a critical perception bottleneck that restricts VLMs from effectively understanding complex visual representations. We propose potential directions for addressing this limitation."

